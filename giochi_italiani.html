const B_POINTS={1:11,3:10,10:4,9:3,8:2};
const B_POWER={1:10,3:9,10:8,9:7,8:6,7:5,6:4,5:3,4:2,2:1};
function briscolaPoints(cards){return (cards||[]).reduce((n,c)=>n+(B_POINTS[c.v]||0),0);}
function startBriscola(names){
  G=null; S=null; activeGameType='briscola';
  const deck=shuffle(newDeck());
  const players=names.map(name=>({name,hand:[],captured:[]}));
  for(let r=0;r<3;r++) for(const p of players) p.hand.push(deck.pop());
  const trumpCard=deck[0]; // carta in fondo al mazzo: verrà pescata per ultima
  B={players,deck,trumpCard,trumpSuit:trumpCard.s,turn:0,trick:[],phase:'play',resolving:false,lastWinner:null,scores:null,teamMode:players.length===4};
  document.getElementById('modal').hidden=true;
  showScreen('briscolaGame');
  renderBriscola();
  if(mode==='host') broadcastBriscola();
}
function startBriscolaBot(){
  closeNet(); mode='bot'; myIndex=0; activeGameType='briscola';
  startBriscola(['Tu','Computer']);
}
function hostStartBriscola(n){
  n=n||Net.expectedPlayers;
  const names=['Giocatore 1 (Host)'];
  for(let i=1;i<n;i++) names.push('Giocatore '+(i+1));
  myIndex=0; mode='host';
  startBriscola(names);
}
function briscolaViewer(){return mode==='guest'?myIndex:0;}
function briscolaCanPlay(){return B && B.phase==='play' && !B.resolving && B.turn===briscolaViewer() && (mode==='bot'||mode==='host'||mode==='guest');}
function briscolaTrickWinner(trick){
  if(!trick.length) return 0;
  const leadSuit=trick[0].card.s;
  let best=trick[0];
  for(const item of trick.slice(1)){
    const c=item.card, b=best.card;
    if(c.s===B.trumpSuit && b.s!==B.trumpSuit) best=item;
    else if(c.s===B.trumpSuit && b.s===B.trumpSuit && B_POWER[c.v]>B_POWER[b.v]) best=item;
    else if(b.s!==B.trumpSuit && c.s===leadSuit && b.s===leadSuit && B_POWER[c.v]>B_POWER[b.v]) best=item;
  }
  return best.pi;
}
function briscolaPlay(pi,id){
  if(!B || B.phase!=='play' || B.resolving || B.turn!==pi) return;
  const p=B.players[pi];
  if(!p || !Array.isArray(p.hand)) return;
  const idx=p.hand.findIndex(c=>c.id===id);
  if(idx<0) return;
  const card=p.hand.splice(idx,1)[0];
  B.trick.push({pi,card});
  if(B.trick.length<B.players.length){
    B.turn=(pi+1)%B.players.length;
    renderBriscola();
    if(mode==='host') broadcastBriscola();
    scheduleBriscolaBot();
    return;
  }
  B.resolving=true;
  renderBriscola();
  if(mode==='host') broadcastBriscola();
  const trickSnapshot=B.trick.slice();
  const winner=briscolaTrickWinner(trickSnapshot);
  setTimeout(()=>{
    if(!B || B.phase!=='play' || B.trick.length!==trickSnapshot.length) return;
    B.resolving=false;
    B.players[winner].captured.push(...trickSnapshot.map(x=>x.card));
    B.lastWinner=winner;
    B.turn=winner;
    // Il vincitore pesca per primo; gli altri seguono nell'ordine di gioco.
    for(let k=0;k<B.players.length;k++){
      const player=B.players[(winner+k)%B.players.length];
      if(B.deck.length){
        const drawn=B.deck.pop();
        player.hand.push(drawn);
        if(B.trumpCard && drawn.id===B.trumpCard.id) B.trumpCard=null;
      }
    }
    B.trick=[];
    if(B.deck.length===0 && B.players.every(pl=>pl.hand.length===0)){
      B.phase='over';
      B.scores=B.players.map(pl=>briscolaPoints(pl.captured));
    }
    renderBriscola();
    if(mode==='host') broadcastBriscola();
    if(B.phase==='play') scheduleBriscolaBot();
  },850);
}
function scheduleBriscolaBot(){
  if(mode==='bot' && B && B.phase==='play' && B.turn===1)
    setTimeout(briscolaBotTurn,650);
}
function briscolaBotTurn(){
  if(mode!=='bot' || !B || B.phase!=='play' || B.turn!==1) return;
  const hand=B.players[1].hand;
  if(!hand.length) return;
  let choice=null, bestScore=-Infinity;
  for(const card of hand){
    let score=(B_POINTS[card.v]||0)*-1 + (B_POWER[card.v]||0)*-.18;
    if(B.trick.length){
      const test=B.trick.concat([{pi:1,card}]);
      const wins=briscolaTrickWinner(test)===1;
      const trickValue=briscolaPoints(test.map(x=>x.card));
      score += wins ? 18+trickValue*1.8+(B_POINTS[card.v]||0)*.35 : -5-(B_POINTS[card.v]||0)*.4;
    }else{
      score += (B_POINTS[card.v]||0)*.22;
      if(card.s===B.trumpSuit) score-=2.5;
    }
    if(score>bestScore){bestScore=score;choice=card;}
  }
  if(choice) briscolaPlay(1,choice.id);
}
function briscolaPublicState(forIndex){
  return {
    players:B.players.map((p,i)=>({name:p.name,hand:i===forIndex?p.hand:null,handCount:p.hand.length,capturedCount:p.captured.length,points:briscolaPoints(p.captured)})),
    deckCount:B.deck.length,trumpCard:B.trumpCard,trumpSuit:B.trumpSuit,turn:B.turn,
    trick:B.trick,phase:B.phase,resolving:!!B.resolving,lastWinner:B.lastWinner,scores:B.scores,teamMode:B.teamMode
  };
}
function broadcastBriscola(){
  if(mode!=='host'||!B) return;
  Net.conns.forEach((conn,i)=>{if(conn&&conn.open){try{conn.send({t:'b-state',s:briscolaPublicState(i)});}catch(e){console.warn('Sync Briscola non riuscita',e);}}});
}
function renderBriscola(){
  if(!B) return;
  const vi=briscolaViewer();
  const info=document.getElementById('bInfo');
  if(B.phase==='over') info.textContent='Partita terminata';
  else if(B.resolving) info.textContent='Presa in corso…';
  else info.textContent=B.turn===vi?'▶ Tocca a te':'Turno di '+B.players[B.turn].name;
  const players=document.getElementById('bPlayers'); players.innerHTML='';
  B.players.forEach((p,i)=>{
    const cardCount=p.hand? p.hand.length : (p.handCount||0);
    const points=p.captured?briscolaPoints(p.captured):(p.points||0);
    const d=document.createElement('div');
    d.className='b-player'+(B.turn===i&&B.phase==='play'?' active':'');
    const team=B.teamMode?' · Squadra '+(i%2===0?'A':'B'):'';
    d.innerHTML=`<strong>${i===vi?'Tu':escapeHtml(p.name)}${team}</strong><small>${points} punti · ${p.captured?p.captured.length:(p.capturedCount||0)} prese</small><div class="b-mini-cards">${'<span class="card back"></span>'.repeat(cardCount)}</div>`;
    players.appendChild(d);
  });
  const trump=document.getElementById('bTrump'); trump.innerHTML='';
  if(B.trumpCard) trump.appendChild(cardEl(B.trumpCard));
  else {const gone=document.createElement('span');gone.className='b-caption';gone.textContent='Pescata';trump.appendChild(gone);}
  document.getElementById('bStockCount').textContent='Mazzo: '+(B.deckCount!==undefined?B.deckCount:B.deck.length)+' carte';
  const trick=document.getElementById('bTrick'); trick.innerHTML='';
  B.trick.forEach(item=>{
    const wrap=document.createElement('div');wrap.className='b-trick-card';
    wrap.appendChild(cardEl(item.card));
    const label=document.createElement('small');label.textContent=B.players[item.pi].name;wrap.appendChild(label);
    trick.appendChild(wrap);
  });
  const hand=document.getElementById('bHand');hand.innerHTML='';
  const myHand=B.players[vi]&&Array.isArray(B.players[vi].hand)?B.players[vi].hand:[];
  myHand.forEach(c=>{
    const el=cardEl(c);el.classList.add('in-hand');el.onclick=()=>briscolaClick(c.id);hand.appendChild(el);
  });
  const score=document.getElementById('bScore');
  if(B.teamMode){
    const a=B.players.filter((p,i)=>i%2===0).reduce((n,p)=>n+(p.captured?briscolaPoints(p.captured):(p.points||0)),0);
    const b=B.players.filter((p,i)=>i%2===1).reduce((n,p)=>n+(p.captured?briscolaPoints(p.captured):(p.points||0)),0);
    score.textContent=`Squadra A: ${a} punti · Squadra B: ${b} punti`;
  }else{
    score.textContent=B.players.map((p,i)=>(i===vi?'Tu':p.name)+': '+(p.captured?briscolaPoints(p.captured):(p.points||0))+' punti').join('   |   ');
  }
  const result=document.getElementById('bResult');
  result.hidden=B.phase!=='over';
  if(B.phase==='over'){
    let heading='';
    if(B.teamMode){
      const a=B.players.filter((p,i)=>i%2===0).reduce((n,p)=>n+B.scores[B.players.indexOf(p)],0);
      const b=B.players.filter((p,i)=>i%2===1).reduce((n,p)=>n+B.scores[B.players.indexOf(p)],0);
      heading=a===b?'🤝 Pareggio':(a>b?'🏆 Vince la squadra A':'🏆 Vince la squadra B')+` · ${Math.max(a,b)} a ${Math.min(a,b)}`;
    }else{
      const a=B.scores[0],b=B.scores[1];
      heading=a===b?'🤝 Partita pari · 60 a 60':(a>b?'🏆 Vince '+B.players[0].name:'🏆 Vince '+B.players[1].name)+` · ${Math.max(a,b)} a ${Math.min(a,b)}`;
    }
    result.innerHTML=heading+(mode==='guest'?'<p style="font-size:12px;color:#fff;font-weight:400">Attendi l’host per una nuova partita.</p>':'<button class="btn gold" onclick="restartBriscola()">🔄 Nuova partita</button><button class="btn small" onclick="quitGame()">Menu principale</button>');
  }
  document.getElementById('bHand').style.opacity=(B.phase==='over'||B.turn!==vi)?'.78':'1';
}
function briscolaClick(id){
  if(!briscolaCanPlay()) return;
  if(mode==='guest'){sendToHost({t:'b-play',id});return;}
  briscolaPlay(briscolaViewer(),id);
}
function restartBriscola(){
  if(mode==='guest'||!B) return;
  const names=B.players.map(p=>p.name);
  startBriscola(names);
}

/* ==================================================================
   SOLITARIO ITALIANO — KLONDIKE ADATTATO AL MAZZO DA 40
   7 colonne, pesca singola, fondazioni Asso-Re.
   ================================================================== */
function solNewGame(){
  closeNet();G=null;B=null;activeGameType='solitaire';mode='solo';
  const deck=shuffle(newDeck());
  const columns=Array.from({length:7},()=>[]);
  for(let col=0;col<7;col++){
    for(let row=0;row<=col;row++) columns[col].push({card:deck.pop(),up:row===col});
  }
  S={stock:deck,waste:[],foundations:{denari:[],coppe:[],spade:[],bastoni:[]},columns,selected:null,moves:0,won:false};
  document.getElementById('modal').hidden=true;
  showScreen('solitaireGame');
  renderSolitaire();
}
function startSolitaire(){solNewGame();}
function solColor(s){return (s==='denari'||s==='coppe')?'warm':'cool';}
function solSequenceValid(cards){
  for(let i=1;i<cards.length;i++) if(cards[i-1].v!==cards[i].v+1 || solColor(cards[i-1].s)===solColor(cards[i].s)) return false;
  return true;
}
function solSourceCards(){
  if(!S||!S.selected)return [];
  const q=S.selected;
  if(q.type==='waste') return S.waste.length?[S.waste[S.waste.length-1]]:[];
  if(q.type==='foundation') return S.foundations[q.suit].length?[S.foundations[q.suit][S.foundations[q.suit].length-1]]:[];
  if(q.type==='column') return S.columns[q.col].slice(q.index).map(x=>x.card);
  return [];
}
function solRemoveSelected(){
  const q=S.selected;let cards=[];
  if(q.type==='waste') cards=S.waste.splice(-1,1);
  else if(q.type==='foundation') cards=S.foundations[q.suit].splice(-1,1);
  else if(q.type==='column'){
    cards=S.columns[q.col].splice(q.index).map(x=>x.card);
    const col=S.columns[q.col];if(col.length)col[col.length-1].up=true;
  }
  S.selected=null;return cards;
}
function solMoveToFoundation(suit){
  if(!S||!S.selected)return false;
  const cards=solSourceCards();if(cards.length!==1)return false;
  const c=cards[0],pile=S.foundations[suit],need=pile.length+1;
  if(c.s!==suit||c.v!==need)return false;
  const moved=solRemoveSelected();pile.push(moved[0]);S.moves++;solCheckWin();renderSolitaire();return true;
}
function solMoveToColumn(colIndex){
  if(!S||!S.selected)return false;
  const moving=solSourceCards();if(!moving.length||!solSequenceValid(moving))return false;
  const dest=S.columns[colIndex];const top=dest.length?dest[dest.length-1]:null;
  if(!top){if(moving[0].v!==10)return false;}
  else if(!top.up||top.card.v!==moving[0].v+1||solColor(top.card.s)===solColor(moving[0].s))return false;
  const cards=solRemoveSelected();cards.forEach(c=>dest.push({card:c,up:true}));S.moves++;renderSolitaire();return true;
}
function solClickStock(){
  if(!S)return;
  S.selected=null;
  if(S.stock.length){S.waste.push(S.stock.pop());S.moves++;}
  else if(S.waste.length){S.stock=S.waste.slice().reverse();S.waste=[];S.moves++;}
  else {document.getElementById('solStatus').textContent='Non ci sono più carte da pescare.';return;}
  renderSolitaire();
}
function solSelect(type,options={}){
  if(!S)return;
  S.selected={type,...options};renderSolitaire();
}
function solTryAutoFoundation(){
  if(!S||!S.selected)return false;
  const cards=solSourceCards();if(cards.length!==1)return false;
  return solMoveToFoundation(cards[0].s);
}
function solClickColumn(colIndex,cardIndex=null){
  if(!S)return;
  if(S.selected){
    const same=S.selected.type==='column'&&S.selected.col===colIndex&&S.selected.index===cardIndex;
    if(same){S.selected=null;renderSolitaire();return;}
    const targetIsTop=cardIndex===null || cardIndex===S.columns[colIndex].length-1;
    if(targetIsTop && solMoveToColumn(colIndex))return;
  }
  if(cardIndex!==null){
    const item=S.columns[colIndex][cardIndex];if(item&&item.up)solSelect('column',{col:colIndex,index:cardIndex});
    else {S.selected=null;renderSolitaire();}
  }else{
    S.selected=null;renderSolitaire();
  }
}
function solFoundationClick(suit){
  if(!S)return;
  if(S.selected){
    if(solMoveToFoundation(suit))return;
    if(S.selected.type==='foundation'&&S.selected.suit===suit){S.selected=null;renderSolitaire();return;}
  }
  const pile=S.foundations[suit];if(pile.length)solSelect('foundation',{suit});
}
function solCheckWin(){
  if(S&&SUITS.every(s=>S.foundations[s].length===10)){
    S.won=true;document.getElementById('solStatus').textContent='🏆 Complimenti! Hai completato il Solitario.';
  }
}
function renderSolitaire(){
  if(!S)return;
  document.getElementById('solMoves').textContent='Mosse: '+S.moves;
  const stock=document.getElementById('solStock');stock.innerHTML='';
  if(S.stock.length){const back=document.createElement('div');back.className='card back';stock.appendChild(back);}
  else {const ph=document.createElement('span');ph.className='sol-placeholder';ph.textContent=S.waste.length?'↻':'—';stock.appendChild(ph);}
  stock.onclick=solClickStock;
  const waste=document.getElementById('solWaste');waste.innerHTML='';
  if(S.waste.length){const c=S.waste[S.waste.length-1],el=cardEl(c);el.classList.add('sol-card');if(S.selected&&S.selected.type==='waste')el.classList.add('sol-selected');el.onclick=e=>{e.stopPropagation();if(S.selected&&S.selected.type==='waste')S.selected=null;else S.selected={type:'waste'};renderSolitaire();};el.ondblclick=e=>{e.stopPropagation();S.selected={type:'waste'};if(!solTryAutoFoundation())renderSolitaire();};waste.appendChild(el);}else{const ph=document.createElement('span');ph.className='sol-placeholder';ph.textContent='·';waste.appendChild(ph);}
  const froot=document.getElementById('solFoundations');froot.innerHTML='';
  SUITS.forEach(suit=>{
    const slot=document.createElement('div');slot.className='sol-slot';slot.title='Fondazione '+SUIT_NAME[suit];
    const pile=S.foundations[suit];
    if(pile.length){const c=pile[pile.length-1],el=cardEl(c);if(S.selected&&S.selected.type==='foundation'&&S.selected.suit===suit)el.classList.add('sol-selected');el.onclick=e=>{e.stopPropagation();solFoundationClick(suit);};slot.appendChild(el);}
    else{const ph=document.createElement('span');ph.className='sol-placeholder';ph.textContent='A';slot.appendChild(ph);}
    slot.onclick=()=>solFoundationClick(suit);froot.appendChild(slot);
  });
  const cols=document.getElementById('solColumns');cols.innerHTML='';
  S.columns.forEach((column,colIndex)=>{
    const col=document.createElement('div');col.className='sol-col';
    column.forEach((item,index)=>{
      const el=item.up?cardEl(item.card):document.createElement('div');
      if(!item.up)el.className='card back';
      el.classList.add('sol-card');
      el.style.top=(index*(window.innerWidth<520?21:27))+'px';
      if(S.selected&&S.selected.type==='column'&&S.selected.col===colIndex&&index>=S.selected.index)el.classList.add('sol-selected');
      if(item.up){el.onclick=e=>{e.stopPropagation();solClickColumn(colIndex,index);};el.ondblclick=e=>{e.stopPropagation();S.selected={type:'column',col:colIndex,index};if(!solTryAutoFoundation())renderSolitaire();};}
      col.appendChild(el);
    });
    col.onclick=()=>solClickColumn(colIndex,null);
    cols.appendChild(col);
  });
  if(!S.won)document.getElementById('solStatus').textContent=S.selected?'Carta selezionata: scegli una colonna o una fondazione compatibile.':'Pesca dal mazzo o seleziona una carta scoperta.';
}


document.getElementById('modal').addEventListener('click', e => {
  if(e.target.id === 'modal') return; // non chiudere cliccando fuori
});
window.addEventListener('beforeunload', closeNet);
