<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Giochi di Carte Napoletane</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% 0%,#1d5c3a 0%,#0d3a24 55%,#071f14 100%);
  color:#f2f5ef;overflow:hidden;user-select:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;overflow-y:auto;padding:10px}
[hidden]{display:none!important}

/* ---------- CARTE ---------- */
.card{
  width:clamp(58px, 17vw, 78px);
  aspect-ratio: 62 / 88;
  height:auto;flex:0 0 auto;position:relative;border-radius:8px;
  background:linear-gradient(145deg,#fffef8 0%,#f7efd9 58%,#eee0c2 100%);
  border:2px solid #a98a52;
  box-shadow:0 3px 7px rgba(0,0,0,.42), inset 0 0 0 1px rgba(255,255,255,.78), inset 0 0 0 3px rgba(181,145,83,.10);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  transition:transform .15s ease, box-shadow .15s ease;
}
.card::before{content:'';position:absolute;inset:4px;border:1px solid rgba(154,119,61,.38);border-radius:5px;pointer-events:none}
.card .pip-field{position:absolute;inset:15% 13% 13%}
.card .pip{position:absolute;transform:translate(-50%,-50%);display:block}
.card .pip svg{width:clamp(14px,3.4vw,19px);height:clamp(14px,3.4vw,19px);display:block;filter:drop-shadow(0 1px 0 rgba(95,62,15,.15))}
.card .pip.ace svg{width:clamp(23px,5vw,30px);height:clamp(23px,5vw,30px)}
.card .face-art{width:82%;height:84%;z-index:1;filter:drop-shadow(0 1px 1px rgba(80,45,10,.15))}
.card .face-art svg{width:100%;height:100%;display:block}
.card .ci{z-index:3;background:rgba(255,253,245,.82);border-radius:4px;padding:2px 3px}
.card .ci svg{width:11px;height:11px}

.card .ci{position:absolute;display:flex;flex-direction:column;align-items:center;
  font-size:clamp(11px,2.8vw,14px);font-weight:900;line-height:1;gap:1px;font-family:Georgia,serif}
.card .ci.tl{top:3px;left:4px}
.card .ci.br{bottom:3px;right:4px;transform:rotate(180deg)}
.card .cc{opacity:.95}
.card.suit-denari{color:#a8801a}
.card.suit-coppe{color:#a8531a}
.card.suit-spade{color:#3d5c85}
.card.suit-bastoni{color:#3f6b34}
.card.suit-denari .pip svg{filter:drop-shadow(0 1px 1px rgba(80,50,0,.35))}
.card .ci{color:inherit;border:1px solid rgba(155,116,46,.28)}
.card.in-hand{cursor:pointer}
.card.in-hand:hover{transform:translateY(-10px);box-shadow:0 8px 16px rgba(0,0,0,.55)}
.card.disabled{filter:brightness(.8) saturate(.7);cursor:default}
.card.back{
  aspect-ratio:34/48;width:48px;height:auto;border-radius:5px;overflow:hidden;
  background:repeating-linear-gradient(45deg,#8d1f2e,#8d1f2e 6px,#a9303f 6px,#a9303f 12px);
  border-color:#5d1220;box-shadow:0 2px 4px rgba(0,0,0,.5)
}
.card.back::before{inset:4px;border:1.5px solid rgba(255,220,160,.55)}



/* ---------- MENU ---------- */
#menu{align-items:center;justify-content:center;gap:14px;text-align:center}
#menu h1{font-size:clamp(26px,7vw,44px);margin:0 0 4px;
  font-family:Georgia,serif;letter-spacing:1px;
  background:linear-gradient(180deg,#ffe9a8,#c9922a);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 2px 12px rgba(0,0,0,.5)}
#menu .sub{opacity:.7;margin-bottom:18px;font-size:14px}
.btn{
  background:linear-gradient(180deg,#2e8b57,#1c5c39);color:#fff;border:1px solid #47b37b;
  padding:13px 26px;border-radius:11px;font-size:16px;font-weight:600;cursor:pointer;
  min-width:250px;box-shadow:0 3px 0 #0e3620, 0 5px 14px rgba(0,0,0,.4);transition:.12s
}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0e3620}
.btn.gold{background:linear-gradient(180deg,#d8a838,#a97b18);border-color:#f0cf72;box-shadow:0 3px 0 #6b4c08,0 5px 14px rgba(0,0,0,.4)}
.btn.small{min-width:auto;padding:9px 16px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}

/* ---------- LOBBY ---------- */
#lobby{align-items:center}
#lobbyBox{width:100%;max-width:640px;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.13);
  border-radius:16px;padding:18px;margin:auto}
#lobbyBox h2{margin:0 0 8px;font-family:Georgia,serif;color:#ffe9a8}
#lobbyBox p{font-size:13.5px;opacity:.85;line-height:1.5;margin:6px 0}
#lobbyBox textarea{width:100%;height:66px;margin:6px 0;padding:8px;border-radius:9px;
  border:1px solid #2a6b47;background:#0b2a1b;color:#bfe8cf;font-family:monospace;font-size:11px;resize:vertical}
#lobbyBox select,#seriesMode{padding:9px 12px;border-radius:8px;background:#0b2a1b;color:#eaf7ee;border:1px solid #47b37b;font-size:15px}
#seriesChoice{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 8px;font-size:14px;color:#ffe9a8}
.slot{border:1px dashed rgba(255,255,255,.22);border-radius:12px;padding:12px;margin:12px 0}
.slot h4{margin:0 0 8px;color:#ffe9a8;font-size:15px}
.slot .status{font-size:12.5px;margin-top:6px;opacity:.8}
.slot .status.ok{color:#7ef2a4;opacity:1;font-weight:700}

/* ---------- GIOCO ---------- */
#game{padding:6px 8px 10px;position:relative}
#bar{display:grid;grid-template-columns:1fr auto 1fr}
#bar #turnInfo{justify-self:start}
#bar #deckCounter{justify-self:center;white-space:nowrap}
#bar #menuBtn{justify-self:end;min-width:auto}
#gameActions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:2px 0 5px}
#dealOverlay{position:fixed;inset:0;z-index:115;pointer-events:none;overflow:hidden}
#dealOverlay .deal-card{position:fixed;z-index:2;margin:0;transform-style:preserve-3d;backface-visibility:hidden}
#dealOverlay .deal-hand{position:fixed;width:76px;height:76px;z-index:3;filter:drop-shadow(0 8px 7px rgba(0,0,0,.45));opacity:0}
#dealOverlay .deal-hand path{fill:#e9b58d;stroke:#8a5037;stroke-width:2.5;stroke-linejoin:round}
#dealOverlay .deal-hand.left{left:-90px;top:42%;}
#dealOverlay .deal-hand.right{right:-90px;top:42%;transform:scaleX(-1)}
#game.dealing #hand,#game.dealing #opponents,#game.dealing #table{visibility:hidden}
#game.dealing #turnInfo,#game.dealing #deckCounter,#game.dealing #meInfo,#game.dealing #gameActions{opacity:.35}
@media(max-width:420px){#bar{gap:4px}#turnInfo{font-size:11px;padding:5px 7px}#deckCounter{font-size:11px;padding:4px 7px!important}#bar .btn{padding:7px 9px;font-size:12px}}
#bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:4px;flex:0 0 auto}
#turnInfo{font-size:13.5px;font-weight:700;padding:6px 12px;border-radius:20px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
#turnInfo.mine{background:linear-gradient(180deg,#d8a838,#a97b18);border-color:#f0cf72;color:#20160a}
#opponents{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:0 0 auto;margin-bottom:6px}
.opp{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.1);border-radius:11px;
  padding:6px 10px;min-width:118px;text-align:center;transition:.2s}
.opp.active{border-color:#ffd76e;box-shadow:0 0 14px rgba(255,215,110,.5);background:rgba(255,215,110,.12)}
.oppname{font-size:12.5px;font-weight:700;color:#ffe9a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.oppcards{display:flex;gap:2px;justify-content:center;margin:4px 0;min-height:48px}
.oppinfo{font-size:10.5px;opacity:.72}

#tableWrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.08);border-radius:14px;
  margin:2px 0 6px;min-height:110px;padding:8px;overflow:visible}
#table{display:flex;gap:clamp(5px,1.5vw,10px);flex-wrap:wrap;justify-content:center;align-items:center;max-width:100%}
#table .card{animation:card-land .24s cubic-bezier(.2,.8,.25,1)}
@keyframes card-land{from{transform:translateY(-5px) scale(.96);opacity:.65}to{transform:translateY(0) scale(1);opacity:1}}
/* Copia animata della carta: parte dalla mano e atterra sul tavolo */
.card.flight-card{
  position:fixed!important;z-index:120!important;margin:0!important;
  pointer-events:none!important;transform-origin:center center;
  box-shadow:0 14px 28px rgba(0,0,0,.62),0 0 0 2px rgba(255,224,151,.45);
  will-change:transform,left,top;
}

#meInfo{font-size:12px;opacity:.8;text-align:center;margin-bottom:4px;flex:0 0 auto}
#seriesInfo{font-size:12px;text-align:center;color:#ffe9a8;padding:4px 8px;margin:0 auto 3px;border:1px solid rgba(255,215,110,.25);border-radius:10px;background:rgba(0,0,0,.15);flex:0 0 auto}
#hand{display:flex;gap:clamp(5px,1.8vw,11px);justify-content:center;align-items:flex-end;min-height:clamp(88px,25vw,118px);
  padding:7px 4px 5px;flex:0 0 auto;max-width:100%;overflow:visible}

/* Evidenzia le carte che stanno per essere raccolte */
.card.capture-selected{
  outline:4px solid #ffd76e;
  outline-offset:3px;
  filter:brightness(1.12);
  z-index:5;
  animation:capture-pulse .55s ease-in-out infinite alternate;
}
@keyframes capture-pulse{from{box-shadow:0 0 8px rgba(255,215,110,.5)}to{box-shadow:0 0 24px rgba(255,215,110,1)}}
#gameActions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin:2px 0 5px}
#meInfo{margin-bottom:2px}
#deckCounter{display:inline-block;padding:5px 10px;border-radius:16px;background:rgba(255,215,110,.14);border:1px solid rgba(255,215,110,.45);color:#ffe9a8;font-weight:800}
#capturedModal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:90;display:flex;align-items:center;justify-content:center;padding:12px}
#capturedBox{width:min(680px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#123c27,#0a2317);border:1.5px solid #47b37b;border-radius:16px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.7)}
#capturedBox h3{text-align:center;color:#ffe9a8;margin:0 0 12px;font-family:Georgia,serif}
#capturedCards{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:7px;justify-items:center}
#capturedCards .card{width:100%;max-width:68px}
#capturedEmpty{text-align:center;opacity:.7;padding:22px}
/* Raccolte sul tavolo: carte coperte, scope scoperte e ruotate */
#capturePiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px;flex:0 0 auto;margin:0 0 4px;max-height:76px;overflow:hidden}
.capture-pile{display:flex;align-items:center;gap:7px;min-width:0;padding:4px 7px;border-radius:9px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.09)}
.capture-pile.mine{border-color:rgba(255,215,110,.28);background:rgba(255,215,110,.07)}
.pile-name{font-size:10px;font-weight:800;color:#ffe9a8;white-space:nowrap;max-width:54px;overflow:hidden;text-overflow:ellipsis}
.pile-stack{position:relative;width:37px;height:42px;flex:0 0 37px}
.pile-back{position:absolute;width:25px;height:36px;border-radius:4px;border:1px solid #5d1220;background:repeating-linear-gradient(45deg,#8d1f2e,#8d1f2e 4px,#a9303f 4px,#a9303f 8px);box-shadow:0 2px 4px #0008}
.pile-back:nth-child(1){left:0;top:4px;transform:rotate(-9deg)}
.pile-back:nth-child(2){left:4px;top:3px;transform:rotate(-3deg)}
.pile-back:nth-child(3){left:8px;top:2px;transform:rotate(4deg)}
.pile-back:nth-child(4){left:11px;top:1px;transform:rotate(9deg)}
.pile-count{font-size:10px;font-weight:800;color:#fff;position:absolute;right:-3px;bottom:-2px;background:#173d29;border:1px solid #7bc49a;border-radius:10px;padding:1px 4px;z-index:5}
.pile-scope{display:flex;align-items:center;gap:2px;min-width:0;overflow:visible}
.pile-scope .card{width:27px;height:auto;flex:0 0 auto;transform:rotate(90deg);transform-origin:center center;box-shadow:0 2px 5px #0009;border-width:1px}
.pile-scope .card::before{inset:2px}
.pile-empty{font-size:9px;opacity:.45}
@media(max-width:420px){#capturePiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;max-height:72px}.capture-pile{padding:3px 5px;gap:4px}.pile-name{max-width:43px;font-size:9px}.pile-stack{width:32px;flex-basis:32px}.pile-scope .card{width:23px}}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:50;backdrop-filter:blur(3px)}
#modalBox{background:linear-gradient(180deg,#123c27,#0a2317);border:1.5px solid #47b37b;
  border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:0 12px 40px rgba(0,0,0,.7)}
#modalBox h3{margin:0 0 14px;font-family:Georgia,serif;color:#ffe9a8;text-align:center;font-size:18px}
.optbtn{display:block;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
  border-radius:11px;padding:10px;margin:8px 0;cursor:pointer;transition:.13s}
.optbtn:hover{background:rgba(255,215,110,.16);border-color:#ffd76e;transform:scale(1.02)}
.optrow{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap}
.optrow .card{width:clamp(52px,14vw,66px);height:auto}
.optrow span{font-size:20px;color:#ffd76e;font-weight:700}

/* ---------- RISULTATI ---------- */
#results{width:100%}
#results table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:10px}
#results th,#results td{padding:7px 5px;text-align:center;border-bottom:1px solid rgba(255,255,255,.1)}
#results th{color:#ffe9a8;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
#results td.name{text-align:left;font-weight:700}
#results tr.win td{background:rgba(255,215,110,.13)}
#results .pts{font-size:17px;font-weight:800;color:#ffd76e}
#results .tags{font-size:10px;opacity:.75;display:block}

#toast{position:fixed;top:14%;left:50%;transform:translate(-50%,-20px);z-index:80;
  background:linear-gradient(180deg,#d8a838,#a97b18);color:#1a1205;padding:12px 28px;
  border-radius:30px;font-weight:900;font-size:20px;letter-spacing:1px;pointer-events:none;
  opacity:0;transition:.3s;box-shadow:0 8px 26px rgba(0,0,0,.6);font-family:Georgia,serif}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){
  .opp{min-width:96px;padding:5px 7px}
  .oppcards .card.back{width:34px}
  #hand{gap:5px;min-height:88px}
  #tableWrap{padding:6px;min-height:100px}
  #table{gap:5px}
  #game{padding:5px 6px 8px}
}
@media(max-height:620px){
  #opponents{margin-bottom:2px}
  .opp{padding:3px 6px}
  #tableWrap{min-height:82px}
  #hand{min-height:78px}
}

/* ---------- CARTE NAPOLETANE: override ---------- */
.card{background:#fffdf6;border:1.5px solid #bdb394}
.card::before{display:none}
.card .ci{display:none}
.card .pip-field{inset:8% 10% 8%}
.card .pip{transform:translate(-50%,-50%) rotate(var(--r,0deg))}
.card .pip svg,.card .pip.ace svg{width:100%;height:100%;display:block;filter:none}
.card .face-art{width:94%;height:96%}

/* ---------- MENU MULTIGIOCO ---------- */
#menu{justify-content:flex-start;overflow-y:auto;padding:22px 12px 28px;gap:10px}
#menu .sub{margin-bottom:5px}
.menu-section{width:min(520px,100%);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 12px 14px;margin:2px 0;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:rgba(0,0,0,.16)}
.menu-section h2{font:700 18px Georgia,serif;color:#ffe9a8;margin:0 0 2px}
.menu-section .btn{width:min(390px,100%);min-width:0;padding:10px 16px}
.menu-section #seriesChoice{margin:0 0 3px}

/* ---------- BRISCOLA ---------- */
#briscolaGame{padding:8px;gap:8px;overflow-y:auto}
.b-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}
#bInfo{font-size:13px;font-weight:800;padding:7px 12px;border-radius:20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15)}
#bPlayers{display:flex;justify-content:center;align-items:stretch;gap:7px;flex-wrap:wrap;flex:0 0 auto}
.b-player{min-width:100px;max-width:calc(50% - 5px);padding:6px 9px;text-align:center;border-radius:11px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.12)}
.b-player.active{border-color:#ffd76e;box-shadow:0 0 12px rgba(255,215,110,.38);background:rgba(255,215,110,.1)}
.b-player strong{display:block;color:#ffe9a8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-player small{display:block;font-size:10px;opacity:.75;margin-top:3px}
.b-mini-cards{display:flex;justify-content:center;gap:2px;margin-top:4px;min-height:30px}
.b-mini-cards .card.back{width:20px;border-radius:3px}
#bCenter{display:flex;align-items:center;justify-content:center;gap:18px;min-height:160px;flex:1 0 145px;padding:10px;border:1px solid rgba(255,255,255,.1);border-radius:15px;background:rgba(0,0,0,.16)}
#bTrumpArea{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:65px}
.b-caption{font-size:11px;color:#ffe9a8;font-weight:800;text-transform:uppercase}
#bTrump .card{width:clamp(42px,11vw,60px)}
#bTrump .card.back{width:clamp(36px,9vw,48px)}
#bStockCount{font-size:10px;opacity:.8}
#bTrick{display:flex;align-items:center;justify-content:center;gap:clamp(5px,2vw,14px);flex-wrap:wrap;min-width:0}
.b-trick-card{display:flex;flex-direction:column;align-items:center;gap:3px;animation:card-land .2s ease-out}
.b-trick-card small{font-size:10px;color:#ffe9a8;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b-trick-card .card{width:clamp(45px,12vw,66px)}
#bScore{text-align:center;font-size:12px;opacity:.85;padding:2px 4px}
#bHand{display:flex;justify-content:center;align-items:flex-end;gap:clamp(5px,1.4vw,11px);min-height:clamp(90px,24vw,120px);padding:6px 2px;flex:0 0 auto}
#bHand .card{width:clamp(58px,16vw,78px);cursor:pointer}
#bHand .card:hover{transform:translateY(-8px)}
#bResult{position:relative;text-align:center;padding:16px;border-radius:14px;border:1px solid #d8b45a;background:rgba(0,0,0,.35);color:#ffe9a8;font-weight:800;font-size:18px}
#bResult .btn{display:block;margin:12px auto 0;min-width:min(280px,100%)}
@media(max-width:420px){#bCenter{gap:8px;padding:7px;min-height:130px}#bPlayers{gap:4px}.b-player{min-width:calc(50% - 4px);padding:5px}#bHand .card{width:clamp(51px,15vw,65px)}}

/* ---------- SOLITARIO ITALIANO A 40 CARTE ---------- */
#solitaireGame{padding:8px 7px 16px;gap:10px;overflow:auto}
.sol-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:0 0 auto}
.sol-top>div:first-child{display:flex;flex-direction:column;gap:3px;color:#ffe9a8;font-family:Georgia,serif}
#solMoves{font:11px 'Segoe UI',sans-serif;opacity:.75;color:#fff}
.sol-top .btn{padding:7px 11px;font-size:12px;min-width:0;margin-left:4px}
.sol-piles{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;flex:0 0 auto}
.sol-source{display:flex;gap:6px}
.sol-slot{position:relative;width:clamp(42px,11vw,64px);height:clamp(60px,16vw,90px);border:1px dashed rgba(255,231,171,.42);border-radius:7px;background:rgba(0,0,0,.14);display:flex;align-items:flex-start;justify-content:center;cursor:pointer}
.sol-slot .card{width:100%;height:100%;border-radius:6px}
.sol-slot .sol-placeholder{font-size:19px;opacity:.34;align-self:center}
#solFoundations{display:flex;gap:clamp(3px,1vw,8px)}
#solFoundations .sol-slot{border-color:rgba(255,215,110,.55)}
#solColumns{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(3px,1vw,8px);align-items:start;flex:0 0 auto;min-height:330px}
.sol-col{position:relative;min-width:0;min-height:clamp(112px,28vw,180px);border:1px dashed rgba(255,255,255,.12);border-radius:7px;background:rgba(0,0,0,.08)}
.sol-col .card{position:absolute;left:0;width:100%;height:auto;aspect-ratio:62/88;border-radius:5px;cursor:pointer}

<script>
/* ==================================================================
   COSTANTI E CARTE
   ================================================================== */
const SUITS = ['denari','coppe','spade','bastoni'];
const SUIT_COLOR = {denari:'#a8801a', coppe:'#a8531a', spade:'#3d5c85', bastoni:'#3f6b34'};
const LABEL = {1:'A', 8:'F', 9:'C', 10:'R'};
const PV = {7:21, 6:18, 1:16, 5:15, 4:14, 3:13, 2:12, 8:10, 9:10, 10:10};

/* ---------- Simboli dei semi (stile carte napoletane) ---------- */
function starPts(cx, cy, r1, r2, n){
  const p = [];
  for(let i = 0; i < n * 2; i++){
    const a = Math.PI * i / n - Math.PI / 2, r = (i % 2) ? r2 : r1;
    p.push((cx + r * Math.cos(a)).toFixed(2) + ',' + (cy + r * Math.sin(a)).toFixed(2));
  }
  return p.join(' ');
}

/* denari/coppe: viewBox quadrato; spade/bastoni: viewBox lungo e stretto (verticale) */
const SYM_VB = {denari:'0 0 24 24', coppe:'0 0 24 24', spade:'0 0 12 48', bastoni:'0 0 12 48'};

function symMarkup(s, face){
  if(s === 'denari'){
    const center = face
      ? `<circle cx="12" cy="12" r="4.6" fill="#f3dc8e" stroke="#7a5a14" stroke-width=".7"/>
         <circle cx="10.4" cy="11" r=".7" fill="#4a2c0c"/><circle cx="13.6" cy="11" r=".7" fill="#4a2c0c"/>
         <path d="M12 11.6v2M10.6 14.6q1.4 .9 2.8 0" fill="none" stroke="#4a2c0c" stroke-width=".7" stroke-linecap="round"/>`
      : `<circle cx="12" cy="12" r="3" fill="#f3dc8e" stroke="#7a5a14" stroke-width=".7"/>
         <circle cx="12" cy="12" r="1.1" fill="#c0391f"/>`;
    return `<circle cx="12" cy="12" r="11" fill="#e8bd3c" stroke="#6f4f12" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="9.3" fill="none" stroke="#fff0a8" stroke-width=".8"/>
      <polygon points="${starPts(12,12,8.6,5.4,12)}" fill="#d4852a" stroke="#7a4a12" stroke-width=".6"/>${center}`;
  }
  if(s === 'coppe'){
    return `<path d="M12 15v5.6" stroke="#6b4a12" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="12" cy="21" rx="5.6" ry="1.5" fill="#d8a92e" stroke="#6b4a12" stroke-width=".9"/>
      <circle cx="12" cy="17.6" r="1.6" fill="#c0391f" stroke="#6b4a12" stroke-width=".7"/>
      <path d="M3.4 3.2h17.2c.4 7-3.4 12-8.6 12S3 10.2 3.4 3.2z" fill="#d8a92e" stroke="#6b4a12" stroke-width="1.1"/>
      <path d="M4 6.2h16c-.2 1.6-.5 2.6-.9 3.6H4.9C4.5 8.8 4.1 7.8 4 6.2z" fill="#c0391f"/>
      <ellipse cx="12" cy="3.2" rx="8.6" ry="1.5" fill="#f3dc8e" stroke="#6b4a12" stroke-width=".9"/>`;
  }
  if(s === 'spade'){
    return `<path d="M6 .8l2.7 4.2v24.4H3.3V5z" fill="#35569a" stroke="#14264a" stroke-width=".8" stroke-linejoin="round"/>
      <path d="M6 4v25" stroke="#9db6e6" stroke-width=".7"/>
      <rect x=".8" y="29.2" width="10.4" height="3" rx="1.5" fill="#dfb23a" stroke="#6f4f12" stroke-width=".8"/>
      <rect x="4.7" y="32.2" width="2.6" height="9" fill="#b3342a" stroke="#5e1a14" stroke-width=".6"/>
      <circle cx="6" cy="43.6" r="2.7" fill="#dfb23a" stroke="#6f4f12" stroke-width=".8"/>`;
  }
  /* bastoni */
  return `<path d="M6 1.2c3.6 0 5.2 3 5 7-.2 4-1.8 7-2.2 12.4-.4 6-.2 15-.7 26.4H3.9C3.4 36 3.6 27 3.2 20.6 2.8 15 1 12.4 1 8.4c0-4 1.6-7.2 5-7.2z" fill="#3f7a35" stroke="#1f4318" stroke-width=".9"/>
    <path d="M6 6v34" stroke="#254f1e" stroke-width=".6"/>
    <path d="M6 10c-2.6-1-3.4-3-3.2-4.6 2.2.2 3.4 1.8 3.2 4.6zM6 17c2.6-1 3.6-3 3.4-4.6-2.2.2-3.6 1.8-3.4 4.6zM6 25c-2.6-1-3.6-3-3.4-4.6 2.2.2 3.6 1.8 3.4 4.6z" fill="#e7bf3d" stroke="#8a6a14" stroke-width=".4"/>
    <path d="M3.9 40.5h4.2v5.8H3.9z" fill="#c0391f"/>`;
}

function suitSVG(s, size, face){
  const dim = size ? `width="${size}" height="${size}"` : '';
  return `<svg viewBox="${SYM_VB[s]}" ${dim} preserveAspectRatio="xMidYMid meet" aria-hidden="true">${symMarkup(s, face)}</svg>`;
}

/* ---------- Assi: grande figura ornamentale per seme ---------- */
function aceSVG(s){
  let g = '';
  if(s === 'denari'){
    g = `<path d="M14 15q2 8 10 12M46 15q-2 8-10 12" stroke="#c4202e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <circle cx="14" cy="11" r="5" fill="#c4202e" stroke="#6b1018" stroke-width="1"/>
      <circle cx="46" cy="11" r="5" fill="#c4202e" stroke="#6b1018" stroke-width="1"/>
      <path d="M9.5 10l-6 2.5 6 2.5zM50.5 10l6 2.5-6 2.5z" fill="#e3b53a" stroke="#6f4f12" stroke-width=".8"/>
      <path d="M16 12q-10 8-8 22 4-6 12-8zM44 12q10 8 8 22-4-6-12-8z" fill="#c4202e" stroke="#6b1018" stroke-width="1"/>
      <circle cx="30" cy="30" r="9" fill="none" stroke="#c4202e" stroke-width="4.5"/>
      <circle cx="30" cy="62" r="20" fill="none" stroke="#e3c33a" stroke-width="6"/>
      <circle cx="30" cy="62" r="23" fill="none" stroke="#8a6a14" stroke-width=".8"/>
      <circle cx="30" cy="62" r="17" fill="none" stroke="#8a6a14" stroke-width=".8"/>
      <g transform="translate(19 51) scale(.92)">${symMarkup('denari', true)}</g>`;
  }else if(s === 'coppe'){
    g = `<path d="M12 36q-10 0-9 9t11 8M48 36q10 0 9 9t-11 8" fill="none" stroke="#e3b53a" stroke-width="3.2"/>
      <ellipse cx="30" cy="83" rx="15" ry="4" fill="#c4202e" stroke="#5e1a14" stroke-width="1"/>
      <path d="M20 83q2-8 10-9 8 1 10 9z" fill="#2f4f9a" stroke="#14264a" stroke-width="1"/>
      <rect x="27" y="58" width="6" height="17" fill="#e3b53a" stroke="#6f4f12" stroke-width="1"/>
      <circle cx="30" cy="66" r="5" fill="#c4202e" stroke="#5e1a14" stroke-width="1"/>
      <path d="M12 34h36c1 14-6 25-18 25S11 48 12 34z" fill="#e3b53a" stroke="#6f4f12" stroke-width="1.4"/>
      <path d="M12.6 42h34.8c-.3 3-1 5.4-2 7.6H14.6c-1-2.2-1.7-4.6-2-7.6z" fill="#c4202e"/>
      <path d="M14 34q2-14 16-14t16 14z" fill="#2f4f9a" stroke="#14264a" stroke-width="1.2"/>
      <rect x="28" y="12" width="4" height="9" fill="#e3b53a" stroke="#6f4f12" stroke-width=".8"/>
      <circle cx="30" cy="9" r="4" fill="#c4202e" stroke="#5e1a14" stroke-width="1"/>`;
  }else{
    const long = `<g transform="translate(19.5 2) scale(1.75)">${symMarkup(s)}</g>`;
    const vine = `<path d="M30 58c-16-2-22 8-14 18 4 5 11 3 12-3" fill="none" stroke="#2d6a3a" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M17 70c-6-2-8-6-7-9 5 0 8 3 7 9zM24 80c-2 6-7 8-10 6 1-5 5-8 10-6z" fill="${s === 'spade' ? '#c4202e' : '#e3b53a'}" stroke="#4a2c0c" stroke-width=".7"/>`;
    g = long + vine;
  }
  return `<svg viewBox="0 0 60 90" preserveAspectRatio="xMidYMid meet" aria-hidden="true">${g}</svg>`;
}

/* ---------- Figure: Fante (8), Cavallo (9), Re (10) ---------- */
function faceSVG(card){
  const s = card.s, v = card.v;
  const title = v === 8 ? 'FANTE' : v === 9 ? 'CAVALLO' : 'RE';
  const [c0, c1, c2] = {
    denari:['#c4202e', '#e3b53a', '#2d6a3a'],
    coppe:['#2f4f9a', '#c4202e', '#e3b53a'],
    spade:['#c4202e', '#2f4f9a', '#e3b53a'],
    bastoni:['#e3b53a', '#c4202e', '#2d6a3a']
  }[s];
  const skin = '#e9b98a', ink = '#3a2412';
  const long = (s === 'spade' || s === 'bastoni');

  /* simbolo del seme tenuto in mano, con la mano in (hx,hy) */
  const held = (hx, hy) => long
    ? `<svg x="${hx - 6}" y="${hy - 37}" width="12" height="48" viewBox="0 0 12 48" overflow="visible">${symMarkup(s)}</svg>`
    : `<svg x="${hx - 12}" y="${hy - 28}" width="24" height="24" viewBox="0 0 24 24">${symMarkup(s, false)}</svg>`;

  const head = (cx, cy, extra) =>
    `<circle cx="${cx}" cy="${cy}" r="10.5" fill="${skin}" stroke="${ink}" stroke-width="1.3"/>
     <circle cx="${cx - 4}" cy="${cy - 1}" r="1.1" fill="${ink}"/><circle cx="${cx + 4}" cy="${cy - 1}" r="1.1" fill="${ink}"/>
     <path d="M${cx - 3} ${cy + 5}q3 2 6 0" fill="none" stroke="#8a3a2a" stroke-width="1.2" stroke-linecap="round"/>${extra || ''}`;

  const hat = (cx, cy) =>
    `<path d="M${cx - 12} ${cy - 3}q1-14 12-14t12 14z" fill="${c1}" stroke="${ink}" stroke-width="1.2"/>
     <path d="M${cx + 10} ${cy - 13}q12-8 16 2-9-1-13 5z" fill="${c2}" stroke="${ink}" stroke-width=".8"/>`;

  let body = '';
  if(v === 9){
    body = `
      <ellipse cx="50" cy="146" rx="38" ry="3.5" fill="#6b3d22" opacity=".35"/>
      <path d="M80 96q16 6 10 30-3-14-13-18z" fill="#4a2a16" stroke="${ink}" stroke-width="1.1"/>
      <path d="M72 108l7 36h-8.5l-5-32z" fill="#c98f55" stroke="${ink}" stroke-width="1.1"/>
      <path d="M60 110l2 34h-8.5l-2-32z" fill="#c98f55" stroke="${ink}" stroke-width="1.1"/>
      <path d="M26 100q2-18 28-20 26-2 33 14 1 16-9 24H42q-14 0-16-18z" fill="#d9a066" stroke="${ink}" stroke-width="1.3"/>
      <path d="M40 110l-7 34h8.5l9-30z" fill="#d9a066" stroke="${ink}" stroke-width="1.1"/>
      <path d="M28 106l-13 28 7 4 17-26z" fill="#d9a066" stroke="${ink}" stroke-width="1.1"/>
      <path d="M28 98q-4-22 4-36l9-9 8 5-5 14q-2 12 4 26z" fill="#d9a066" stroke="${ink}" stroke-width="1.3"/>
      <path d="M33 58q-14 0-22 14l5 5q8-7 15-5z" fill="#d9a066" stroke="${ink}" stroke-width="1.3"/>
      <circle cx="25" cy="64" r="1.3" fill="${ink}"/>
      <path d="M41 53q6 6 2 18 4 6 0 14" fill="none" stroke="#4a2a16" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M48 82h30l-2 16H46z" fill="${c1}" stroke="${ink}" stroke-width="1.1"/>
      <path d="M56 84l-3 22h7l5-20z" fill="${c2}" stroke="${ink}" stroke-width="1.1"/>
      <path d="M50 106h11v4H49z" fill="#2a2a2a"/>
      <path d="M52 84q-1-22 11-24 11 0 11 24z" fill="${c0}" stroke="${ink}" stroke-width="1.2"/>
      <path d="M70 66l12-18 5 3-9 21z" fill="${c0}" stroke="${ink}" stroke-width="1.1"/>
      ${held(86, 47)}
      <circle cx="86" cy="47" r="3.8" fill="${skin}" stroke="${ink}" stroke-width="1"/>
      ${head(63, 48, hat(63, 48))}`;
  }else{
    const king = v === 10;
    body = `
      <ellipse cx="50" cy="143" rx="30" ry="3.6" fill="#6b3d22" opacity=".35"/>
      ${king ? `<path d="M32 62h36l9 78H23z" fill="${c1}" stroke="${ink}" stroke-width="1.4" stroke-linejoin="round"/>` : ''}
      <path d="M40 98h9l-1 38h-8.5z" fill="${c2}" stroke="${ink}" stroke-width="1.2"/>
      <path d="M51 98h9l1.5 38H52z" fill="${king ? c0 : c1}" stroke="${ink}" stroke-width="1.2"/>
      <path d="M37 136h12v5H35zM52 136h12l2 5H52z" fill="#2a2a2a"/>
      <path d="M34 62q16-7 32 0l3 40H31z" fill="${c0}" stroke="${ink}" stroke-width="1.3"/>
      <rect x="31" y="90" width="38" height="5" fill="${c1}" stroke="${ink}" stroke-width="1"/>
      <path d="M42 62q8 8 16 0" fill="#fff6dc" stroke="${ink}" stroke-width="1"/>
      <path d="M34 64l-9 26 6 3 9-22z" fill="${c0}" stroke="${ink}" stroke-width="1.1"/>
      <circle cx="28" cy="93" r="3.6" fill="${skin}" stroke="${ink}" stroke-width="1"/>
      <path d="M66 64l13-20 5 4-11 22z" fill="${c0}" stroke="${ink}" stroke-width="1.1"/>
      ${held(81, 44)}
      <circle cx="81" cy="44" r="3.8" fill="${skin}" stroke="${ink}" stroke-width="1"/>
      ${head(50, 44, king
        ? `<path d="M41 48q9 18 18 0q-9 4-18 0z" fill="#efe6cf" stroke="${ink}" stroke-width=".8"/>
           <path d="M38 38l2-13 6 6 4-9 4 9 6-6 2 13z" fill="#e3b53a" stroke="#6f4f12" stroke-width="1.2"/>`
        : hat(50, 44))}`;
  }
  return `<div class="face-art"><svg viewBox="0 0 100 150" role="img" aria-label="${title}">${body}</svg></div>`;
}

/* ---------- Disposizione dei simboli, come nel mazzo napoletano ---------- */
function pipLayout(s, v){
  if(s === 'denari' || s === 'coppe'){
    const sz = {2:46, 3:42, 4:36, 5:36, 6:34, 7:27}[v];
    const h = sz * 0.672;               /* il campo pip ha proporzioni ~ 62:93 */
    const L = {
      2:[[50,25],[50,75]],
      3:[[68,17],[32,50],[68,83]],       /* a zig-zag */
      4:[[30,22],[70,22],[30,78],[70,78]],
      5:[[30,20],[70,20],[50,50,1.3],[30,80],[70,80]],
      6:[[30,18],[70,18],[30,50],[70,50],[30,82],[70,82]],
      7:[[28,14],[72,14],[28,50],[72,50],[28,86],[72,86],[50,32]]
    }[v];
    return L.map(([x, y, k]) => ({x, y, w: sz * (k || 1), h: h * (k || 1), r: 0}));
  }
  /* spade e bastoni: lame/bastoni lunghi */
  const E = (x, y, w, h, r) => ({x, y, w, h, r: r || 0});
  return {
    2:[E(32,50,34,96), E(68,50,34,96)],
    3:[E(22,50,30,96), E(78,50,30,96), E(50,50,30,96)],
    4:[E(30,28,24,52,144), E(70,28,24,52,216), E(30,72,24,52,36), E(70,72,24,52,324)],
    5:[E(50,50,26,58), E(30,28,24,52,144), E(70,28,24,52,216), E(30,72,24,52,36), E(70,72,24,52,324)],
    6:[E(30,17,30,30,-25), E(70,17,30,30,25), E(30,50,30,30,-25), E(70,50,30,30,25), E(30,83,30,30,-25), E(70,83,30,30,25)],
    7:[E(30,14,30,30,-25), E(70,14,30,30,25), E(30,50,30,30,-25), E(70,50,30,30,25), E(30,86,30,30,-25), E(70,86,30,30,25), E(50,32,28,28,90)]
  }[v];
}

const SUIT_NAME = {denari:'Denari', coppe:'Coppe', spade:'Spade', bastoni:'Bastoni'};
const RANK_NAME = {1:'Asso', 8:'Fante', 9:'Cavallo', 10:'Re'};

function cardEl(card){
  const el = document.createElement('div');
  el.className = 'card suit-' + card.s;
  el.dataset.cardId = card.id;
  el.setAttribute('aria-label', (RANK_NAME[card.v] || card.v) + ' di ' + SUIT_NAME[card.s]);
  let center = '';
  if(card.v >= 8){
    center = faceSVG(card);
  }else if(card.v === 1){
    center = `<div class="pip-field"><span class="pip ace" style="left:50%;top:50%;width:94%;height:100%">${aceSVG(card.s)}</span></div>`;
  }else{
    const face = card.s === 'denari' && card.v <= 3;
    center = `<div class="pip-field">${pipLayout(card.s, card.v).map(p =>
      `<span class="pip" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%;--r:${p.r}deg">${suitSVG(card.s, 0, face)}</span>`
    ).join('')}</div>`;
  }
  el.innerHTML = center;
  return el;
}
/* ==================================================================
   MOTORE DI GIOCO
   ================================================================== */
let G = null;
let B = null;
let S = null;
let activeGameType = 'scopa';
let selectedSeriesMode = 'single';
let mode = 'local';       // local | bot | host | guest
let myIndex = 0;
let dealAnimating = false;
let dealAnimationToken = 0;

function newDeck(){
  const d = [];
  for(const s of SUITS) for(let v = 1; v <= 10; v++) d.push({s, v, id: s + '-' + v});
  return d;
}
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame(names, seriesMode=selectedSeriesMode, seriesState=null){
  B = null; S = null; activeGameType = 'scopa';
  const deck = shuffle(newDeck());
  const series = seriesState || {
    mode: seriesMode === 'triple' ? 'triple' : 'single', round: 1,
    wins: names.map(() => 0), totals: names.map(() => 0), history: []
  };
  G = {
    players: names.map(n => ({name: n, hand: [], captured: [], scopa: 0, scopaCards: []})),
    deck, table: [], turn: 0, phase: 'play',
    pending: null, lastCapturer: null, scores: null,
    series, roundRecorded: false
  };
  for(let i = 0; i < 4; i++) G.table.push(G.deck.pop());
  for(const p of G.players) for(let i = 0; i < 3; i++) p.hand.push(G.deck.pop());
  G.turn = 0;
  dealAnimating = true;
  showScreen('game');
  postMove();
  setTimeout(() => runDealAnimation(), 180);
}

function handCount(p){ return p.hand ? p.hand.length : (p.handCount || 0); }

/* --- trova le possibili prese --- */
function findCaptures(table, card){
  const opts = [];
  // priorità assoluta: carta di valore identico
  for(let i = 0; i < table.length; i++) if(table[i].v === card.v) opts.push([i]);
  if(opts.length) return opts;
  // altrimenti combinazioni di somme
  const n = table.length;
  for(let mask = 1; mask < (1 << n); mask++){
    let sum = 0; const idx = [];
    for(let i = 0; i < n; i++){
      if(mask & (1 << i)){ sum += table[i].v; idx.push(i); if(sum > card.v) break; }
    }
    if(sum === card.v) opts.push(idx);
  }
  return opts;
}

/* --- esegue una giocata --- */
let moveAnimating = false;

/* La carta viene animata prima di aggiornare la mano e il tavolo. */
function animateCardToTable(pi, card){
  return new Promise(resolve => {
    const tableWrap = document.getElementById('tableWrap');
    const handCard = pi === viewerIndex()
      ? document.querySelector(`#hand .card[data-card-id="${card.id}"]`)
      : document.querySelector(`.opp[data-player-index="${pi}"] .oppcards .card.back`);
    if(!tableWrap || !handCard){ setTimeout(resolve, 80); return; }

    const from = handCard.getBoundingClientRect();
    const to = tableWrap.getBoundingClientRect();
    const clone = cardEl(card);
    clone.classList.add('flight-card');
    const enlarged = pi !== viewerIndex();
    const flightW = enlarged ? 72 : from.width;
    const flightH = flightW * 88 / 62;
    const startX = from.left + from.width / 2;
    const startY = from.top + from.height / 2;
    clone.style.left = (startX - flightW / 2) + 'px';
    clone.style.top = (startY - flightH / 2) + 'px';
    clone.style.width = flightW + 'px';
    clone.style.height = flightH + 'px';
    clone.style.borderRadius = '8px';
    document.body.appendChild(clone);

    const dx = to.left + to.width / 2 - startX;
    const dy = to.top + to.height / 2 - startY;
    /* Movimento più lento e carta avversaria ben leggibile */
    const duration = Math.min(1550, Math.max(1150, 900 + Math.hypot(dx,dy) * .42));

    if(clone.animate){
      const animation = clone.animate([
        {transform:'translate3d(0,0,0) rotate(0deg) scale(1)',offset:0},
        {transform:`translate3d(${dx*.52}px,${dy*.52-24}px,0) rotate(9deg) scale(1.12)`,offset:.58},
        {transform:`translate3d(${dx}px,${dy}px,0) rotate(0deg) scale(.94)`,offset:1}
      ],{duration,easing:'cubic-bezier(.22,.75,.25,1)',fill:'forwards'});
      animation.onfinish = () => { clone.remove(); resolve(); };
      animation.oncancel = () => { clone.remove(); resolve(); };
    }else{
      clone.style.transition = `transform ${duration}ms cubic-bezier(.22,.75,.25,1)`;
      requestAnimationFrame(() => { clone.style.transform = `translate3d(${dx}px,${dy}px,0) rotate(0deg) scale(.94)`; });
      setTimeout(() => { clone.remove(); resolve(); },duration+40);
    }
  });
}

async function animateCapturedCards(pi, captured){
  if(!captured || !captured.length) return;
  const table = document.getElementById('table');
  const target = document.querySelector('.capture-pile[data-player-index="'+pi+'"] .pile-stack');
  if(!table || !target) return;
  const targetRect = target.getBoundingClientRect();
  const cards = [];
  captured.forEach(c=>{
    const source = table.querySelector('.card[data-card-id="'+c.id+'"]');
    if(!source) return;
    source.classList.add('capture-selected');
    const r = source.getBoundingClientRect();
    const clone = cardEl(c);
    clone.classList.add('flight-card');
    clone.style.width = '62px';
    clone.style.height = (62*88/62)+'px';
    clone.style.left = (r.left+r.width/2-31)+'px';
    clone.style.top = (r.top+r.height/2-44)+'px';
    document.body.appendChild(clone);
    cards.push({clone, source:r});
  });
  if(!cards.length) return;
  await new Promise(resolve=>setTimeout(resolve,420));
  const animations = cards.map(({clone,source})=>{
    const dx = targetRect.left+targetRect.width/2-(source.left+source.width/2);
    const dy = targetRect.top+targetRect.height/2-(source.top+source.height/2);
    if(clone.animate){
      const a=clone.animate([
        {transform:'translate3d(0,0,0) scale(1)',opacity:1},
        {transform:`translate3d(${dx*.55}px,${dy*.55-18}px,0) scale(1.08)`,opacity:1,offset:.55},
        {transform:`translate3d(${dx}px,${dy}px,0) rotateY(180deg) scale(.38)`,opacity:.25}
      ],{duration:950,easing:'cubic-bezier(.2,.7,.25,1)',fill:'forwards'});
      return new Promise(done=>{a.onfinish=done;a.oncancel=done;});
    }
    clone.style.transition='transform 950ms ease,opacity 950ms ease';
    requestAnimationFrame(()=>{clone.style.transform=`translate3d(${dx}px,${dy}px,0) rotateY(180deg) scale(.38)`;clone.style.opacity='.25';});
    return new Promise(done=>setTimeout(done,980));
  });
  await Promise.all(animations);
  cards.forEach(x=>x.clone.remove());
}

async function resolvePlay(pi, card, idxs){
  if(!G || G.phase !== 'play' || moveAnimating || !Number.isInteger(pi) || !G.players[pi]) return;
  if(idxs && (!Array.isArray(idxs) || idxs.some(i => !Number.isInteger(i) || i < 0 || i >= G.table.length) || new Set(idxs).size !== idxs.length)) return;
  const gameAtStart = G;
  const p = G.players[pi];
  const ci = p.hand.findIndex(c => c.id === card.id);
  if(ci < 0) return;

  moveAnimating = true;
  if(mode === 'host') Net.conns.forEach(conn=>{
    if(conn && conn.open) try{conn.send({t:'animate-play',pi,card});}catch(e){}
  });
  await animateCardToTable(pi, card);
  if(G !== gameAtStart){ moveAnimating = false; return; }

  p.hand.splice(ci, 1);
  let captured = [];
  if(idxs && idxs.length){
    captured = idxs.map(i => G.table[i]);
    if(mode === 'host') Net.conns.forEach(conn=>{
      if(conn && conn.open) try{conn.send({t:'animate-capture',pi,cards:captured});}catch(e){}
    });
    await animateCapturedCards(pi, captured);
    if(G !== gameAtStart){ moveAnimating = false; return; }
    const sorted = [...idxs].sort((a, b) => b - a);
    for(const i of sorted) G.table.splice(i, 1);
    p.captured.push(card, ...captured);
    G.lastCapturer = pi;
  } else {
    G.table.push(card);
  }

  const isLast = G.deck.length === 0 && G.players.every(pl => pl.hand.length === 0);
  if(captured.length && G.table.length === 0 && !isLast){
    p.scopa++;
    if(!Array.isArray(p.scopaCards)) p.scopaCards=[];
    p.scopaCards.push(card); // la carta che ha fatto scopa resta scoperta e di traverso
    toast('SCOPA! ' + p.name);
  }

  if(isLast){
    if(G.table.length && G.lastCapturer !== null){
      G.players[G.lastCapturer].captured.push(...G.table);
      G.table = [];
    }
    G.phase = 'over';
    G.scores = computeScores();
    recordSeriesRound();
  } else {
    G.turn = (G.turn + 1) % G.players.length;
    if(G.players.every(pl => pl.hand.length === 0) && G.deck.length > 0){
      for(const pl of G.players)
        for(let k = 0; k < 3 && G.deck.length > 0; k++) pl.hand.push(G.deck.pop());
    }
  }
  G.pending = null;
  moveAnimating = false;
  postMove();
}

/* --- punteggio --- */
function computeScores(){
  const n = G.players.length;
  const res = G.players.map((p, i) => ({
    i, name: p.name,
    carte: p.captured.length,
    denari: p.captured.filter(c => c.s === 'denari').length,
    settebello: p.captured.some(c => c.s === 'denari' && c.v === 7) ? 1 : 0,
    primiera: 0,
    scope: p.scopa,
    punti: 0,
    tags: []
  }));

  for(let i = 0; i < n; i++){
    let tot = 0;
    for(const s of SUITS){
      let best = 0;
      for(const c of G.players[i].captured)
        if(c.s === s) best = Math.max(best, PV[c.v] || 0);
      tot += best;
    }
    res[i].primiera = tot;
  }

  function award(key, label){
    let max = -1, winners = [];
    for(const r of res){
      if(r[key] > max){ max = r[key]; winners = [r.i]; }
      else if(r[key] === max) winners.push(r.i);
    }
    if(winners.length === 1 && max > 0){
      const w = res.find(r => r.i === winners[0]);
      w.punti++; w.tags.push(label);
    }
  }
  award('carte', 'Carte');
  award('denari', 'Denari');
  award('primiera', 'Primiera');
  for(const r of res) if(r.settebello){ r.punti++; r.tags.push('Settebello'); }
  for(const r of res) r.punti += r.scope;

  return res;
}

function recordSeriesRound(){
  if(!G || G.roundRecorded || !Array.isArray(G.scores)) return;
  const series = G.series || (G.series={mode:'single',round:1,wins:G.players.map(()=>0),totals:G.players.map(()=>0),history:[]});
  G.scores.forEach(r=>{ series.totals[r.i]=(series.totals[r.i]||0)+r.punti; });
  const max=Math.max(...G.scores.map(r=>r.punti));
  const winners=G.scores.filter(r=>r.punti===max);
  if(winners.length===1) series.wins[winners[0].i]=(series.wins[winners[0].i]||0)+1;
  series.history.push(G.scores.map(r=>r.punti));
  G.roundRecorded=true;
}

function seriesFinished(){
  return !G || !G.series || G.series.mode!=='triple' || G.series.round>=3;
}

/* --- bot --- */
function botChoose(){
  const p = G.players[G.turn];
  let best = null;
  for(const card of p.hand){
    const opts = findCaptures(G.table, card);
    for(const o of opts){
      const taken = o.map(i => G.table[i]);
      let sc = taken.length * 10;
      if(G.table.length - o.length === 0) sc += 100;
      sc += taken.filter(c => c.s === 'denari').length * 3;
      if(taken.some(c => c.s === 'denari' && c.v === 7)) sc += 8;
      if(!best || sc > best.sc) best = {card, o, sc};
    }
  }
  if(best) return {card: best.card, o: best.o};
  const sorted = [...p.hand].sort((a, b) => {
    const va = a.v + (a.s === 'denari' ? 3 : 0) + (a.v === 7 ? 4 : 0);
    const vb = b.v + (b.s === 'denari' ? 3 : 0) + (b.v === 7 ? 4 : 0);
    return va - vb;
  });
  return {card: sorted[0], o: null};
}

function botTurn(){
  if(!G || G.phase !== 'play' || mode !== 'bot') return;
  if(G.turn === 0 || G.pending) return;
  const {card, o} = botChoose();
  resolvePlay(G.turn, card, o);
}

function makeDealHand(side){
  const hand=document.createElementNS('http://www.w3.org/2000/svg','svg');
  hand.setAttribute('viewBox','0 0 100 100');
  hand.classList.add('deal-hand',side);
  hand.innerHTML='<path d="M24 55 L18 35 Q16 27 22 25 Q28 23 31 31 L38 45 L35 18 Q34 9 41 8 Q49 7 50 17 L53 43 L57 14 Q58 5 65 7 Q73 9 71 18 L67 47 L75 25 Q79 17 86 21 Q93 25 88 34 L76 65 Q70 83 53 88 L39 88 Q27 82 24 70 Z"/>';
  return hand;
}
function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function runDealAnimation(){
  if(!G || !dealAnimating) return;
  const token=++dealAnimationToken;
  const game=document.getElementById('game');
  game.classList.add('dealing');
  const overlay=document.createElement('div');
  overlay.id='dealOverlay';
  const leftHand=makeDealHand('left'), rightHand=makeDealHand('right');
  overlay.append(leftHand,rightHand); game.appendChild(overlay);
  await wait(120);
  const tableWrap=document.getElementById('tableWrap');
  const tr=tableWrap.getBoundingClientRect();
  const sx=tr.left+tr.width/2, sy=tr.top+tr.height/2;
  const fly=async(target,kind,card,handSide,delay)=>{
    if(token!==dealAnimationToken) return;
    if(delay) await wait(delay);
    const rect=target.getBoundingClientRect();
    if(!rect.width || !rect.height) return;
    const el=(kind==='face' && card)?cardEl(card):document.createElement('div');
    if(kind!=='face') el.className='card back';
    el.classList.add('deal-card');
    el.style.left=sx+'px'; el.style.top=sy+'px';
    el.style.width=Math.min(rect.width,kind==='back'?48:rect.width)+'px';
    el.style.height='auto';
    el.style.position='fixed'; el.style.transform='translate(-50%,-50%) rotate(-8deg) scale(.82)';
    overlay.appendChild(el);
    const hand=handSide==='left'?leftHand:rightHand;
    const startHandX=handSide==='left'?-90:window.innerWidth+90;
    const endHandX=rect.left+rect.width/2+(handSide==='left'?28:-28);
    const endHandY=rect.top+rect.height/2-10;
    hand.style.opacity='1';
    const handAnim=hand.animate([
      {transform:`translateX(0) translateY(0) ${handSide==='right'?'scaleX(-1)':''}`,left:startHandX+'px',top:(sy-35)+'px'},
      {transform:`translateX(0) translateY(0) ${handSide==='right'?'scaleX(-1)':''}`,left:endHandX+'px',top:endHandY+'px',offset:.72},
      {left:(handSide==='left'?-100:window.innerWidth+100)+'px',top:(endHandY-15)+'px',opacity:0}
    ],{duration:390,easing:'cubic-bezier(.2,.7,.25,1)'});
    const cardAnim=el.animate([
      {left:sx+'px',top:sy+'px',width:(kind==='back'?42:rect.width*.72)+'px',transform:'translate(-50%,-50%) rotate(-10deg) scale(.82)'},
      {left:(rect.left+rect.width/2)+'px',top:(rect.top+rect.height/2)+'px',width:rect.width+'px',transform:'translate(-50%,-50%) rotate(0deg) scale(1)'}
    ],{duration:390,easing:'cubic-bezier(.18,.72,.25,1)',fill:'forwards'});
    await Promise.all([handAnim.finished.catch(()=>{}),cardAnim.finished.catch(()=>{})]);
    hand.style.opacity='0';
    if(kind==='flip'){
      await el.animate([{transform:'translate(-50%,-50%) rotateY(0deg)'},{transform:'translate(-50%,-50%) rotateY(90deg)'}],{duration:150,easing:'ease-in'}).finished.catch(()=>{});
      const face=cardEl(card); face.classList.add('deal-card');
      face.style.left=(rect.left+rect.width/2)+'px'; face.style.top=(rect.top+rect.height/2)+'px'; face.style.width=rect.width+'px';
      overlay.replaceChild(face,el);
      await face.animate([{transform:'translate(-50%,-50%) rotateY(90deg)'},{transform:'translate(-50%,-50%) rotateY(0deg)'}],{duration:180,easing:'ease-out',fill:'forwards'}).finished.catch(()=>{});
    }
    await wait(35);
  };

  // Carte ai giocatori: il dorso resta visibile all'avversario; la propria mano si gira.
  const vi=viewerIndex();
  const jobs=[];
  for(let round=0;round<3;round++){
    for(let pi=0;pi<G.players.length;pi++){
      const p=G.players[pi];
      let target,card,kind;
      if(pi===vi){
        target=document.querySelectorAll('#hand .card')[round];
        card=p.hand && p.hand[round]; kind='flip';
      }else{
        target=document.querySelector(`.opp[data-player-index="${pi}"] .oppcards .card:nth-child(${round+1})`);
        kind='back';
      }
      if(target) jobs.push({target,kind,card,side:pi===vi?'right':'left'});
    }
  }
  // Le quattro carte centrali vengono distribuite scoperte.
  const centerCards=Array.from(document.querySelectorAll('#table .card'));
  centerCards.forEach((target,i)=>jobs.push({target,kind:'face',card:G.table[i],side:i%2?'right':'left'}));
  for(let i=0;i<jobs.length;i++){
    if(token!==dealAnimationToken) break;
    const j=jobs[i]; await fly(j.target,j.kind,j.card,j.side,i===0?0:75);
  }
  await wait(180);
  if(token===dealAnimationToken){
    overlay.remove(); game.classList.remove('dealing'); dealAnimating=false; render();
  }
}

/* ==================================================================
   RENDER
   ================================================================== */
function viewerIndex(){
  if(mode === 'local') return G.turn;
  if(mode === 'host') return 0;
  if(mode === 'guest') return myIndex;
  if(mode === 'bot') return 0;
  return 0;
}
function canAct(){
  if(mode === 'local') return true;
  if(mode === 'bot') return G.turn === 0;
  if(mode === 'host') return G.turn === 0;
  if(mode === 'guest') return G.turn === myIndex;
  return false;
}

function postMove(){
  render();
  if(mode === 'host') broadcast();
  if(mode === 'bot' && G && G.phase === 'play' && G.turn !== 0)
    setTimeout(botTurn, 850);
}

function renderCapturePiles(){
  const root=document.getElementById('capturePiles');
  if(!root || !G) return;
  const vi=viewerIndex();
  root.innerHTML='';
  G.players.forEach((p,i)=>{
    const captured=Array.isArray(p.captured)?p.captured:[];
    const scopes=Array.isArray(p.scopaCards)?p.scopaCards:[];
    const pile=document.createElement('div');
    pile.className='capture-pile'+(i===vi?' mine':'');
    pile.dataset.playerIndex=i;
    const name=document.createElement('span');
    name.className='pile-name';
    name.textContent=i===vi?'Tu':p.name;
    const stack=document.createElement('div');
    stack.className='pile-stack';
    const backs=Math.min(4,Math.max(0,captured.length-scopes.length));
    for(let k=0;k<backs;k++){const b=document.createElement('span');b.className='pile-back';stack.appendChild(b);}
    if(captured.length-scopes.length>4){const count=document.createElement('span');count.className='pile-count';count.textContent=captured.length-scopes.length;stack.appendChild(count);}
    if(!backs && !scopes.length){const empty=document.createElement('span');empty.className='pile-empty';empty.textContent='—';stack.appendChild(empty);}
    const scopeBox=document.createElement('div');
    scopeBox.className='pile-scope';
    scopes.forEach(c=>{
      const visible=cardEl(c);
      visible.classList.add('scope-card');
      visible.title='Scopa';
      scopeBox.appendChild(visible);
    });
    const label=document.createElement('span');
    label.className='pile-name';
    label.textContent=captured.length+' carte';
    pile.append(name,stack,scopeBox,label);
    root.appendChild(pile);
  });
}

function render(){
  if(!G) return;
  const vi = viewerIndex();
  const me = G.players[vi];

  /* avversari */
  const opp = document.getElementById('opponents');
  opp.innerHTML = '';
  G.players.forEach((p, i) => {
    if(i === vi) return;
    const d = document.createElement('div');
    d.className = 'opp' + (G.turn === i && G.phase === 'play' ? ' active' : '');
    d.dataset.playerIndex = i;
    const backs = '<span class="card back"></span>'.repeat(handCount(p));
    d.innerHTML =
      `<div class="oppname">${escapeHtml(p.name)}</div>
       <div class="oppcards">${backs}</div>
       <div class="oppinfo">Prese ${p.captured.length} · Scope ${p.scopa}</div>`;
    opp.appendChild(d);
  });

  /* tavolo */
  const tbl = document.getElementById('table');
  tbl.innerHTML = '';
  if(G.table.length === 0){
    tbl.innerHTML = '<div style="opacity:.4;font-size:13px">Tavolo vuoto</div>';
  }
  G.table.forEach(c => tbl.appendChild(cardEl(c)));
  renderCapturePiles();

  /* info turno */
  const ti = document.getElementById('turnInfo');
  if(G.phase === 'over'){
    ti.textContent = 'Partita terminata';
    ti.className = '';
  } else if(G.pending){
    ti.textContent = 'Scegli la presa…';
    ti.className = G.pending.pi === vi ? 'mine' : '';
  } else {
    ti.textContent = (G.turn === vi ? '▶ Tocca a te' : 'Turno di ' + G.players[G.turn].name);
    ti.className = (G.turn === vi) ? 'mine' : '';
  }

  /* la mia mano */
  const hand = document.getElementById('hand');
  hand.innerHTML = '';
  const cards = me.hand || [];
  const playable = !dealAnimating && G.phase === 'play' && G.turn === vi && !G.pending && canAct();
  cards.forEach(c => {
    const el = cardEl(c);
    el.classList.add('in-hand');
    if(playable) el.onclick = () => onCardClick(c.id);
    else el.classList.add('disabled');
    hand.appendChild(el);
  });

  /* info mia */
  const mi = document.getElementById('meInfo');
  const remainingDeck = Array.isArray(G.deck) ? G.deck.length :
    (G.deck && Number.isFinite(G.deck.length) ? G.deck.length : 0);
  mi.textContent = `${me.name} — Prese: ${me.captured.length} · Scope: ${me.scopa}`;
  const seriesInfo=document.getElementById('seriesInfo');
  if(seriesInfo){
    if(G.series && G.series.mode==='triple'){
      seriesInfo.hidden=false;
      seriesInfo.textContent=`TORNEO ${G.series.round}/3 · `+G.players.map((p,i)=>`${p.name}: ${G.series.totals[i]||0} pt (${G.series.wins[i]||0} partite vinte)`).join('  |  ');
    }else{seriesInfo.hidden=true;seriesInfo.textContent='';}
  }
  const counter = document.getElementById('deckCounter');
  if(counter) counter.textContent = `Carte nel mazzo: ${remainingDeck}`;
  document.getElementById('turnInfo').style.display = '';

  renderModal();
}

function showCapturedCards(){
  if(!G) return;
  const vi=viewerIndex();
  const player=G.players[vi];
  const box=document.getElementById('capturedCards');
  document.getElementById('capturedTitle').textContent='Carte prese da '+player.name+' ('+player.captured.length+')';
  box.innerHTML='';
  if(!player.captured.length){
    box.innerHTML='<div id="capturedEmpty">Non hai ancora preso carte.</div>';
  }else{
    player.captured.forEach(c=>box.appendChild(cardEl(c)));
  }

function resultsHTML(){
  const sc = G.scores || [];
  const max = Math.max(...sc.map(r => r.punti), 0);
  const currentSeries=G.series || {mode:'single',round:1};
  let h = `<div id="results"><h3>🏆 ${currentSeries.mode==='triple'?'Risultati partita '+currentSeries.round+' di 3':'Risultati finali'}</h3><table><tr>` +
    '<th>Giocatore</th><th>Carte</th><th>Denari</th><th>Prim.</th><th>Scope</th><th>Punti</th></tr>';
  sc.forEach(r => {
    const tags = r.tags.length ? `<span class="tags">${r.tags.join(' · ')}</span>` : '';
    h += `<tr class="${r.punti === max ? 'win' : ''}">
      <td class="name">${escapeHtml(r.name)}${tags}</td>
      <td>${r.carte}</td><td>${r.denari}${r.settebello ? ' ★' : ''}</td>
      <td>${r.primiera}</td><td>${r.scope}</td>
      <td class="pts">${r.punti}</td></tr>`;
  });
  h += '</table>';
  const series=G.series || {mode:'single',round:1,wins:[],totals:[]};
  if(series.mode==='triple'){
    h += `<h4 style="color:#ffe9a8;text-align:center;margin:16px 0 8px">🏅 Torneo · Partita ${series.round} di 3</h4>`;
    h += '<table><tr><th>Giocatore</th><th>Partite vinte</th><th>Punti totali</th></tr>';
    G.players.forEach((p,i)=>{h+=`<tr class="${series.totals[i]===Math.max(...series.totals)?'win':''}"><td class="name">${escapeHtml(p.name)}</td><td>${series.wins[i]||0}</td><td class="pts">${series.totals[i]||0}</td></tr>`;});
    h += '</table>';
    if(series.round>=3){
      const best=Math.max(...series.totals), champions=G.players.filter((p,i)=>series.totals[i]===best);
      h += `<p style="text-align:center;color:#ffe9a8;font-weight:800">${champions.length===1?'🏆 Vince il torneo: '+escapeHtml(champions[0].name):'🤝 Torneo in parità'}</p>`;
    }
  }
  if(mode === 'guest'){
    h += '<p style="text-align:center;opacity:.7;font-size:13px">In attesa che l\'host avvii la prossima partita…</p>';
  } else if(series.mode==='triple' && series.round<3){
    h += `<button class="btn" style="min-width:auto;width:100%" onclick="nextSeriesRound()">▶️ Inizia partita ${series.round+1} di 3</button>`;
    h += '<button class="btn small" style="min-width:auto;width:100%;margin-top:8px" onclick="restartGame()">Ricomincia il torneo</button>';
  } else {
    h += '<button class="btn" style="min-width:auto;width:100%" onclick="restartGame()">🔄 Nuova partita</button>';
  }
  if(mode!=='guest') h += '<button class="btn" style="min-width:auto;width:100%;margin-top:8px;background:linear-gradient(180deg,#555,#333);border-color:#777" onclick="quitGame()">Menu principale</button>';
  h += '</div>';
  return h;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

}

function onCardClick(cardId){
  if(!G || G.phase !== 'play' || G.pending) return;
  const vi = viewerIndex();
  if(G.turn !== vi) return;
  if(mode === 'guest'){ sendToHost({t: 'play', id: cardId}); return; }
  if(!canAct()) return;
  playCard(vi, cardId);
}

function playCard(pi, cardId){
  const p = G.players[pi];
  const card = p.hand.find(c => c.id === cardId);
  if(!card) return;
  const opts = findCaptures(G.table, card);
  if(opts.length === 0)      resolvePlay(pi, card, null);
  else if(opts.length === 1) resolvePlay(pi, card, opts[0]);
  else { G.pending = {pi, card, opts}; postMove(); }
}

function chooseOption(k){
  if(!G.pending) return;
  const {pi, card, opts} = G.pending;
  if(pi !== viewerIndex()) return;
  if(mode === 'guest'){ sendToHost({t: 'choose', k}); return; }
  resolvePlay(pi, card, opts[k]);
}

const Net = {

  peer: null,
  dc: null,
  connected: [],
  reserved: [],
  roomCode: null,

const PEER_OPTIONS = {

  path: '/',

      { urls: 'stun:stun.l.google.com:19302' },

    ]
  },
  debug: 1
};

function closeNet(){
  clearTimeout(Net.joinTimer);
  Net.joinTimer = null;
  try{
    Net.conns.forEach(c => { try{ if(c) c.close(); }catch(e){} });
    if(Net.dc){ try{ Net.dc.close(); }catch(e){} }
    if(Net.peer){ try{ Net.peer.destroy(); }catch(e){} }
  }catch(e){}
  Net.conns = [];
  Net.connected = [];
  Net.reserved = [];
  Net.peer = null;
  Net.dc = null;
  Net.roomCode = null;
}

async function createNumericRoom(){
  const status=document.getElementById('hostStatus');
  const codeEl=document.getElementById('roomCode');
  if(!status || !codeEl) return;
  if(typeof Peer === 'undefined'){
    status.textContent='❌ Libreria di connessione non caricata. Controlla Internet e ricarica la pagina.';
    return;
  }
  let attempts=0;
  const tryCreate=()=>{
    attempts++;
    const code=makeRoomCode();
    const peer=new Peer('scopa-'+code, PEER_OPTIONS);
    Net.peer=peer;
    peer.on('open', id=>{
      if(Net.peer!==peer) return;
      Net.roomCode=code;
      codeEl.textContent=code;
      status.textContent='✅ Stanza pronta. Comunica il codice agli altri giocatori.';
      status.className='status ok';
    });
    peer.on('connection', conn=>{
      if(Net.peer!==peer) { conn.close(); return; }
      const freeIndex=[];
      for(let i=1;i<Net.expectedPlayers;i++) if(!Net.connected[i] && !Net.reserved[i]) freeIndex.push(i);
      if(!freeIndex.length){
        conn.on('open',()=>conn.send({t:'room-full'}));
        setTimeout(()=>conn.close(),1200);
        return;
      }
      const index=freeIndex[0];
      Net.reserved[index]=true;
      Net.conns[index]=conn;
      conn.on('open',()=>{
        if(!Net.peer || Net.peer!==peer) return;
        Net.connected[index]=true;
        const st=document.getElementById('host-slot-'+index);
        if(st){st.textContent='✅ Giocatore '+(index+1)+' connesso';st.className='status ok';}
        conn.send({t:'hello',index});
        checkHostReady();
        if(G && mode==='host') broadcast();
        if(B && mode==='host') broadcastBriscola();
      });
      conn.on('data',msg=>hostOnMessage({dc:conn,playerIndex:index},msg));
      conn.on('close',()=>{
        Net.connected[index]=false;
        Net.reserved[index]=false;
        Net.conns[index]=null;
        const st=document.getElementById('host-slot-'+index);
        if(st){st.textContent='❌ Disconnesso';st.className='status';}
        checkHostReady();
      });
      conn.on('error',err=>{console.warn('Connessione giocatore:',err); if(!Net.connected[index]){Net.reserved[index]=false;Net.conns[index]=null;checkHostReady();}});
    });
    peer.on('error',err=>{
      if(Net.peer!==peer) return;
      if(err.type==='unavailable-id' && attempts<8){
        peer.destroy();
        tryCreate();
      }else{
        status.textContent='❌ Connessione non riuscita: '+(err.type||err.message||'errore');
        status.className='status';
      }
    });
    peer.on('disconnected',()=>{
      if(Net.peer===peer && status) status.textContent='⚠️ Servizio temporaneamente disconnesso.';
    });
  };
  tryCreate();
}

function checkHostReady(){
  const btn=document.getElementById('startHostBtn');
  if(btn) btn.disabled=Net.connected.filter(Boolean).length !== Net.expectedPlayers-1;
}

function hostOnMessage(conn,msg){
  if(!msg || typeof msg!=='object') return;
  if(msg.t==='b-play'){
    if(B && B.phase==='play' && B.turn===conn.playerIndex && typeof msg.id==='string')
      briscolaPlay(conn.playerIndex,msg.id);
    return;
  }
  if(msg.t==='play'){
    if(G && G.phase==='play' && G.turn===conn.playerIndex && !G.pending &&
       typeof msg.id==='string')
      playCard(conn.playerIndex,msg.id);
  }else if(msg.t==='choose'){
    if(G && G.pending && G.pending.pi===conn.playerIndex &&
       Number.isInteger(msg.k) && msg.k>=0 && msg.k<G.pending.opts.length)
      resolvePlay(conn.playerIndex,G.pending.card,G.pending.opts[msg.k]);
  }
}

function hostStartGame(n){
  activeGameType='scopa'; B=null; S=null;
  n=n || Net.expectedPlayers;
  const seriesSelect=document.getElementById('hostSeriesMode');
  if(seriesSelect) selectedSeriesMode=seriesSelect.value;
  const names=['Giocatore 1 (Host)'];
  for(let i=1;i<n;i++) names.push('Giocatore '+(i+1));
  myIndex=0;
  startGame(names, selectedSeriesMode);
  broadcast();
}

function guestJoinRoom(){
  const input=document.getElementById('roomCodeIn');
  const status=document.getElementById('joinStatus');
  const btn=document.getElementById('joinRoomBtn');
  const code=(input.value||'').trim();
  if(!/^\d{5}$/.test(code)){
    status.textContent='Inserisci un codice valido di 5 cifre.';
    return;
  }
  if(typeof Peer==='undefined'){
    status.textContent='❌ Libreria di connessione non caricata. Controlla Internet e riprova.';
    return;
  }

  // Chiude eventuali tentativi precedenti senza ricaricare la pagina.
  clearTimeout(Net.joinTimer);
  if(Net.dc){try{Net.dc.close();}catch(e){} Net.dc=null;}
  if(Net.peer){try{Net.peer.destroy();}catch(e){} Net.peer=null;}
  let finished=false;
  let openedPeer=false;
  let openedConnection=false;
  const peer=new Peer(undefined,PEER_OPTIONS);
  Net.peer=peer;
  Net.dc=null;
  btn.disabled=true;
  input.disabled=false;
  status.className='status';
  status.textContent='⏳ Connessione al servizio…';

  const finish=(message, ok=false)=>{
    if(finished) return;
    finished=true;
    clearTimeout(Net.joinTimer);
    Net.joinTimer=null;
    status.textContent=message;
    status.className=ok?'status ok':'status';
    btn.disabled=false;
    if(!ok){
      input.disabled=false;
      if(Net.dc){try{Net.dc.close();}catch(e){} Net.dc=null;}
      if(Net.peer===peer){try{peer.destroy();}catch(e){} Net.peer=null;}
    }
  };

  // Timeout globale: copre sia l'accesso al servizio sia la ricerca della stanza.
  Net.joinTimer=setTimeout(()=>{
    if(!openedPeer) finish('❌ Il servizio PeerJS non risponde. Controlla Internet e riprova.');
    else if(!openedConnection) finish('⌛ Nessuna risposta dalla stanza entro 18 secondi. Verifica il codice o riprova più tardi.');
  },18000);

  peer.on('open',()=>{
    if(Net.peer!==peer || finished) return;
    openedPeer=true;
    status.textContent='🔎 Ricerca della partita '+code+'…';
    const conn=peer.connect('scopa-'+code,{reliable:true,serialization:'json'});
    Net.dc=conn;
    conn.on('open',()=>{
      if(Net.peer!==peer || finished) return;
      openedConnection=true;
      finished=true;
      clearTimeout(Net.joinTimer);
      Net.joinTimer=null;
      status.textContent='✅ Collegato! Attendo l’avvio della partita…';
      status.className='status ok';
      input.disabled=true;
      btn.disabled=false;
    });
    conn.on('data',msg=>{
      if(finished && msg && msg.t==='room-full') return;
      if(msg && msg.t==='room-full'){
        finish('❌ La partita è completa.');
        return;
      }
      guestOnMessage(msg);
    });
    conn.on('close',()=>{
      if(!openedConnection) finish('❌ Stanza non raggiungibile o connessione interrotta. Controlla il codice e riprova.');
      else {
        status.textContent='❌ Connessione chiusa dall’host.';
        status.className='status';
        btn.disabled=false;
        input.disabled=false;
      }
    });
    conn.on('error',err=>{
      finish('❌ Errore di connessione: '+(err.type||err.message||'verifica il codice e riprova.'));
    });
  });
  peer.on('error',err=>{
    if(finished) return;
    const type=err && err.type;
    if(type==='peer-unavailable') finish('❌ Stanza non trovata. Controlla il codice di 5 cifre.');
    else finish('❌ Servizio di connessione non disponibile: '+(type||(err&&err.message)||'errore sconosciuto')+'. Riprova.');
  });
  peer.on('disconnected',()=>{
    if(!openedConnection && !finished) finish('❌ Collegamento al servizio interrotto. Controlla Internet e riprova.');
  });
}
function guestOnMessage(msg){
  if(!msg || typeof msg!=='object') return;
  if(msg.t==='hello'){
    myIndex=msg.index;
  }else if(msg.t==='b-state'){
    activeGameType='briscola';
    B=msg.s;
    showScreen('briscolaGame');
    renderBriscola();
  }else if(msg.t==='animate-play'){
    if(G && msg.card && Number.isInteger(msg.pi)) animateCardToTable(msg.pi,msg.card);
  }else if(msg.t==='animate-capture'){
    if(G && Array.isArray(msg.cards) && Number.isInteger(msg.pi)) animateCapturedCards(msg.pi,msg.cards);
  }else if(msg.t==='state'){
    activeGameType='scopa';
    const firstState=!G;
    const newSeriesRound=!!(G && msg.s && G.series && msg.s.series && G.series.round!==msg.s.series.round);
    G=msg.s; B=null; S=null;
    G.players.forEach(p=>{if(!Array.isArray(p.scopaCards))p.scopaCards=[];});
    showScreen('game');
    if(firstState || newSeriesRound){dealAnimating=true;render();setTimeout(()=>runDealAnimation(),180);}
    else render();
  }
}

function sendToHost(obj){
  if(Net.dc && Net.dc.open){
    try{Net.dc.send(obj);}catch(e){console.warn('Invio al host non riuscito',e);}
  }
}

/* ---------------- SYNC ---------------- */
function publicState(g,forIdx){
  return {
    players:g.players.map((p,i)=>({
      name:p.name,
      hand:(i===forIdx)?p.hand:null,
      handCount:p.hand.length,
      captured:p.captured,
      scopa:p.scopa,
      scopaCards:p.scopaCards || []
    })),
    table:g.table,
    deck:{length:g.deck.length},
    turn:g.turn,
    phase:g.phase,
    pending:g.pending,
    lastCapturer:g.lastCapturer,
    scores:g.scores,
    series:g.series,
    roundRecorded:g.roundRecorded
  };
}

function broadcast(){
  if(mode!=='host' || !G) return;
  Net.conns.forEach((conn,i)=>{
    if(conn && conn.open){
      try{conn.send({t:'state',s:publicState(G,i)});}
      catch(e){console.warn('Sincronizzazione non riuscita',e);}
    }
  });
}
